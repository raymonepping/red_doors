# Door openers (prompt 06), namespace rd-doors. One image, seven identities.
#
# Each Deployment mounts ONLY its own credential source:
#   opener-1/4/6, impostor : projected SA token (audience vault)
#   opener-3               : role-id ConfigMap (secret-id arrives wrapped per knock)
#   opener-5               : projected SA token for the key cutter (cert issued per knock)
#   opener-7               : the VSO-synced Secret — no Vault address, token or role
# ConfigMap opener-3-role-id and Secret impostor-forged-cert are created by
# scripts/doors.sh (values come from Vault / openssl, never from this file).
---
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata: { name: opener, namespace: rd-doors, labels: { app.kubernetes.io/part-of: red-doors } }
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata: { name: opener, namespace: rd-doors, labels: { app.kubernetes.io/part-of: red-doors } }
spec:
  source: { type: Binary }
  strategy: { type: Docker, dockerStrategy: {} }
  output: { to: { kind: ImageStreamTag, name: "opener:latest" } }
  resources: { limits: { memory: 1Gi } }
---
# ── opener-1 — Kubernetes auth ───────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opener-1
  namespace: rd-doors
  labels: { app.kubernetes.io/part-of: red-doors, app: opener, red-doors/door: "1" }
  annotations:
    image.openshift.io/triggers: '[{"from":{"kind":"ImageStreamTag","name":"opener:latest"},"fieldPath":"spec.template.spec.containers[?(@.name==\"opener\")].image"}]'
spec:
  replicas: 1
  selector: { matchLabels: { red-doors/opener: "1" } }
  template:
    metadata:
      labels: { app: opener, red-doors/opener: "1", app.kubernetes.io/part-of: red-doors }
      annotations: { openshift.io/required-scc: restricted-v2 }
    spec:
      serviceAccountName: opener-1
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: opener
          image: image-registry.openshift-image-registry.svc:5000/rd-doors/opener:latest
          env:
            - { name: DOOR_ID, value: "1" }
            - { name: SERVICE_ACCOUNT, value: opener-1 }
          ports: [{ name: http, containerPort: 8080 }]
          readinessProbe: { httpGet: { path: /health, port: 8080 }, periodSeconds: 10 }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] }, readOnlyRootFilesystem: true }
          resources: { requests: { cpu: 10m, memory: 48Mi }, limits: { memory: 128Mi } }
          volumeMounts:
            - { name: vault-token, mountPath: /var/run/secrets/vault, readOnly: true }
            - { name: ca, mountPath: /ca, readOnly: true }
      volumes:
        - name: vault-token
          projected: { sources: [ { serviceAccountToken: { audience: vault, expirationSeconds: 600, path: token } } ] }
        - name: ca
          configMap: { name: red-doors-ca }
---
# ── opener-3 — AppRole (role-id at rest, secret-id wrapped per knock) ────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opener-3
  namespace: rd-doors
  labels: { app.kubernetes.io/part-of: red-doors, app: opener, red-doors/door: "3" }
  annotations:
    image.openshift.io/triggers: '[{"from":{"kind":"ImageStreamTag","name":"opener:latest"},"fieldPath":"spec.template.spec.containers[?(@.name==\"opener\")].image"}]'
spec:
  replicas: 1
  selector: { matchLabels: { red-doors/opener: "3" } }
  template:
    metadata:
      labels: { app: opener, red-doors/opener: "3", app.kubernetes.io/part-of: red-doors }
      annotations: { openshift.io/required-scc: restricted-v2 }
    spec:
      serviceAccountName: opener-3
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: opener
          image: image-registry.openshift-image-registry.svc:5000/rd-doors/opener:latest
          env:
            - { name: DOOR_ID, value: "3" }
            - { name: SERVICE_ACCOUNT, value: opener-3 }
          ports: [{ name: http, containerPort: 8080 }]
          readinessProbe: { httpGet: { path: /health, port: 8080 }, periodSeconds: 10 }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] }, readOnlyRootFilesystem: true }
          resources: { requests: { cpu: 10m, memory: 48Mi }, limits: { memory: 128Mi } }
          volumeMounts:
            - { name: role-id, mountPath: /approle, readOnly: true }
            - { name: ca, mountPath: /ca, readOnly: true }
      volumes:
        - name: role-id
          configMap: { name: opener-3-role-id }
        - name: ca
          configMap: { name: red-doors-ca }
---
# ── opener-4 — dynamic PostgreSQL credentials ────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opener-4
  namespace: rd-doors
  labels: { app.kubernetes.io/part-of: red-doors, app: opener, red-doors/door: "4" }
  annotations:
    image.openshift.io/triggers: '[{"from":{"kind":"ImageStreamTag","name":"opener:latest"},"fieldPath":"spec.template.spec.containers[?(@.name==\"opener\")].image"}]'
spec:
  replicas: 1
  selector: { matchLabels: { red-doors/opener: "4" } }
  template:
    metadata:
      labels: { app: opener, red-doors/opener: "4", red-doors/needs-db: "true", app.kubernetes.io/part-of: red-doors }
      annotations: { openshift.io/required-scc: restricted-v2 }
    spec:
      serviceAccountName: opener-4
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: opener
          image: image-registry.openshift-image-registry.svc:5000/rd-doors/opener:latest
          env:
            - { name: DOOR_ID, value: "4" }
            - { name: SERVICE_ACCOUNT, value: opener-4 }
            - { name: PGHOST, value: postgres.rd-data.svc }
          ports: [{ name: http, containerPort: 8080 }]
          readinessProbe: { httpGet: { path: /health, port: 8080 }, periodSeconds: 10 }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] }, readOnlyRootFilesystem: true }
          resources: { requests: { cpu: 10m, memory: 48Mi }, limits: { memory: 128Mi } }
          volumeMounts:
            - { name: vault-token, mountPath: /var/run/secrets/vault, readOnly: true }
            - { name: ca, mountPath: /ca, readOnly: true }
      volumes:
        - name: vault-token
          projected: { sources: [ { serviceAccountToken: { audience: vault, expirationSeconds: 600, path: token } } ] }
        - name: ca
          configMap: { name: red-doors-ca }
---
# ── opener-5 — PKI client certificate + TLS cert auth ────────────────────────
apiVersion: apps/v1
