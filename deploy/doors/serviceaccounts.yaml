# Door identities in rd-doors (prompt 03; the opener Deployments arrive in 06).
# Each Vault Kubernetes-auth role binds exactly ONE of these. Automount is off:
# pods get a projected token with audience "vault" instead.
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: opener-1, namespace: rd-doors, labels: { app.kubernetes.io/part-of: red-doors, red-doors/door: "1" } }
automountServiceAccountToken: false
---
