# Helm values — seal Vault (release `vault-seal`, namespace rd-vault-seal).
#
# The root of trust: a 1-node Vault Enterprise whose only job is the Transit
# key `autounseal` that unseals the main cluster in rd-vault. It is itself
# Shamir-sealed (1 share — local POC, same choice as Arcanium's vault-s) and
# unsealed by `make vault-unseal` from .secrets/vault/seal-init.json.
global:
  openshift: true
  tlsDisable: false

injector:
  enabled: false

server:
  image:
    repository: docker.io/hashicorp/vault-enterprise
    # multi-arch manifest list (amd64 + arm64); CRC on Apple Silicon is arm64
    tag: "2.1.0-ent@sha256:12c3ac1469d11da17747927128ed11bce825a012d3ce13b066d0442d0105df0a"

  enterpriseLicense:
    secretName: vault-license
    secretKey: license

  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 512Mi }

  # In-pod CLI talks TLS to its own listener with the project CA.
  extraEnvironmentVars:
    VAULT_CACERT: /vault/userconfig/vault-seal-tls/ca.crt

  extraVolumes:
    - type: secret
      name: vault-seal-tls

  readinessProbe:
    enabled: true
    # HTTPS health check instead of the chart default `vault status -tls-skip-verify`
    path: "/v1/sys/health?standbyok=true&sealedcode=204&uninitcode=204"
  livenessProbe:
    enabled: false

  dataStorage:
    enabled: true
    size: 1Gi
  auditStorage:
    enabled: false # audit goes to stdout (file device), see scripts/vault-up.sh

  # Single-node CRC: no anti-affinity needed for one replica, but keep the
  # chart default from turning into a scheduling constraint.
  affinity: ""

  route:
    enabled: true
    activeService: false # standalone: route to the `vault-seal` service
    host: vault-seal.apps-crc.testing
    tls:
      termination: passthrough

  standalone:
    enabled: true
    config: |
      ui = false
      log_level = "info"

      listener "tcp" {
        address         = "[::]:8200"
        cluster_address = "[::]:8201"
        tls_cert_file   = "/vault/userconfig/vault-seal-tls/tls.crt"
        tls_key_file    = "/vault/userconfig/vault-seal-tls/tls.key"
      }

      storage "raft" {
        path    = "/vault/data"
        node_id = "vault-seal-0"
      }

      api_addr     = "https://vault-seal.rd-vault-seal.svc:8200"
      cluster_addr = "https://vault-seal-0.vault-seal-internal:8201"

  ha:
    enabled: false

ui:
  enabled: false
